<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skull">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Skull Online</title>
<style>
:root{
  --bg:#14110f; --panel:#1f1a17; --panel2:#2a2420; --line:#3a312b; --text:#efe6d8; --dim:#9c8f80;
  --bone:#e8dcc4; --rose:#c8334a; --rose2:#7d1f2e; --gold:#d9a441; --ok:#5fae7a;
}
body[data-theme="red"]{--felt1:#6a1a26;--felt2:#2a0b10;--back1:#2b211b;--rim:#b99a6b;--face1:#eadfc6;--face2:#2a2321;--r1:#c8334a;--r2:#7d1f2e;--sk:#efe6d0}
body[data-theme="green"]{--felt1:#23653f;--felt2:#0d2b1b;--back1:#1d2a20;--rim:#d9a441;--face1:#f1e7c8;--face2:#16201a;--r1:#e0613c;--r2:#8a2a14;--sk:#f4efdf}
body[data-theme="neon"]{--felt1:#22286b;--felt2:#0a0c24;--back1:#0e1030;--rim:#38f2ff;--face1:#171a45;--face2:#0b0d26;--r1:#ff3df0;--r2:#8f0f8a;--sk:#c8fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(900px 500px at 50% -10%,#2b1d1a,transparent),var(--bg)}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:.02em}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:.6em 1em;border-radius:10px;cursor:pointer;min-height:40px;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:#dc3d56}
button.sm{padding:.25em .6em;font-size:.9rem;min-height:36px;min-width:36px}
button.on{border-color:var(--ok);color:var(--ok)}
button.off{border-color:var(--rose);color:#e88}
input,select{font:inherit;color:var(--text);background:#0f0d0b;border:1px solid var(--line);border-radius:10px;padding:.6em .8em;width:100%;min-height:44px}
input:focus,select:focus{outline:2px solid var(--rose2)}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));padding-top:calc(12px + env(safe-area-inset-top))}
.home{max-width:420px;margin:6vh auto 0;text-align:center}
.home h1{font-size:3rem;color:var(--bone)}
.home .sub{color:var(--dim);margin:.3em 0 1.6em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.card+.card{margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>button{flex:0 0 auto}
.lbl{font-size:.78rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hdr h2{font-size:1.25rem;display:flex;align-items:center;gap:8px}
.code{font-family:ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);padding:.15em .55em;border-radius:8px;letter-spacing:.2em;color:var(--gold)}
.tools{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;position:relative}
.badge{position:absolute;top:-5px;right:-5px;background:var(--rose);color:#fff;border-radius:99px;font-size:.7rem;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:.95rem}
.banner b{color:var(--gold)}
.banner.me{border-left-color:var(--rose);background:#2a1b1d}
.cd{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- Bàn tròn ---- */
.table{position:relative;width:100%;max-width:640px;margin:0 auto 14px;aspect-ratio:1/1.12}
.felt{position:absolute;inset:15% 11%;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,var(--felt1),var(--felt2));border:7px solid #3b2a1e;box-shadow:inset 0 0 40px #000b,0 12px 30px #000a,0 0 0 2px #1b120c}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:44%;pointer-events:none}
.center .big{font-family:Georgia,serif;font-size:2.4rem;line-height:1;color:var(--bone);text-shadow:0 2px 8px #000}
.center .small{font-size:.78rem;color:#eadfc6bb;margin-top:4px}
.center .ring{display:inline-block;margin-top:6px;font-size:1.05rem;color:var(--gold);font-variant-numeric:tabular-nums}
.seat{position:absolute;transform:translate(-50%,-50%);width:118px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.seat.top{flex-direction:column-reverse}
.pill{width:100%;background:#1b1512e6;border:1px solid var(--line);border-radius:10px;padding:3px 6px;font-size:.82rem;text-align:center;backdrop-filter:blur(2px)}
.pill .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill .sub{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:.72rem;min-height:16px}
.seat.turn .pill{border-color:var(--gold);animation:pulse 1.8s infinite}
.seat.out{opacity:.4}
.seat.me .pill{border-color:var(--rose2)}
.tag{font-size:.66rem;padding:.05em .45em;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tag.bid{color:var(--gold);border-color:var(--gold)}
.tag.off{color:#d77}
.pips i{display:inline-block;width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--gold);margin:0 3px}
.pips i.on{background:var(--gold)}
.mat{display:flex;min-height:46px;align-items:center;justify-content:center;padding-left:14px}
.mat .empty{width:44px;height:44px;border-radius:50%;border:2px dashed #ffffff22}
.flipbtn{padding:.25em .8em;min-height:34px;font-size:.85rem;width:100%}
.kickbtn{font-size:.7rem;padding:.1em .5em;min-height:26px}

/* ---- Đĩa SVG ---- */
.disc{position:relative;width:46px;height:46px;margin-left:-16px;flex:none;filter:drop-shadow(0 2px 3px #000a);user-select:none;display:block}
.disc svg{width:100%;height:100%;display:block}
.mat .disc:first-child{margin-left:0}
.mk{position:absolute;right:1px;bottom:1px;width:15px;height:15px;border-radius:50%;border:2px solid var(--gold);background:var(--r1)}
.mk.S{background:var(--sk)}
.hand{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.hand .disc{margin:0;width:56px;height:56px}
button.dbtn{padding:0;border:0;background:none;min-height:0;border-radius:50%}
button.dbtn.act .disc{animation:pulse2 1.2s infinite}
button.dbtn:hover:not(:disabled) .disc{transform:translateY(-3px)}
.disc{transition:transform .15s}
.ico{width:20px;height:20px;vertical-align:-5px;margin-right:4px}

/* ---- Panel của tôi (dính đáy màn hình) ---- */
.panel{position:sticky;bottom:0;z-index:6;background:#1f1a17f2;backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));margin-top:4px;box-shadow:0 -8px 24px #0009}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;border-radius:0;background:var(--panel2);padding:.45em 1em;font-size:1.2rem}
.stepper span{min-width:2.4em;text-align:center;font-weight:700;font-size:1.2rem}
.log{max-height:170px;overflow:auto;font-size:.86rem;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.log div:last-child{color:var(--text)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3a1a20;border:1px solid var(--rose);padding:.6em 1em;border-radius:10px;z-index:30;max-width:90vw}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px}
.plist li:last-child{border:0}
.rules summary,details.card summary{cursor:pointer;color:var(--dim)}
.rules ul{color:var(--dim);font-size:.9rem;padding-left:1.1em}
.big{font-size:1.4rem;font-family:Georgia,serif}
table.sb{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0}
table.sb th,table.sb td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
table.sb th:not(:first-child),table.sb td:not(:first-child){text-align:center}
.hist{font-size:.85rem;color:var(--dim);display:flex;flex-direction:column;gap:2px;margin-top:6px}

/* ---- Hiệu ứng ---- */
@keyframes drop{0%{transform:translateY(-46px) scale(1.25) rotate(-12deg);opacity:0}60%{transform:translateY(4px) scale(.96);opacity:1}100%{transform:none}}
@keyframes flipin{0%{transform:perspective(300px) rotateY(90deg) scale(1.15)}100%{transform:perspective(300px) rotateY(0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-8px,3px)}30%{transform:translate(7px,-4px)}45%{transform:translate(-6px,-2px)}60%{transform:translate(5px,3px)}80%{transform:translate(-2px,1px)}}
@keyframes flash{0%{opacity:.6}100%{opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #d9a44100}50%{box-shadow:0 0 16px 2px #d9a44177}}
@keyframes pulse2{0%,100%{filter:drop-shadow(0 2px 3px #000a)}50%{filter:drop-shadow(0 0 9px var(--gold))}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(720deg)}}
@keyframes floatup{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}15%{transform:translate(-50%,-90%) scale(1.3);opacity:1}100%{transform:translate(-50%,-420%) scale(1);opacity:0}}
.disc.drop{animation:drop .45s cubic-bezier(.2,.8,.3,1)}
.disc.flipin{animation:flipin .55s ease-out}
.tag.pop{animation:pop .5s}
#app.shake{animation:shake .5s}
.fx{position:fixed;inset:0;pointer-events:none;z-index:8}
.fx.red{background:radial-gradient(circle,transparent 30%,#c8334a 130%);animation:flash .9s forwards}
.fx.gold{background:radial-gradient(circle,transparent 30%,#d9a441 130%);animation:flash .9s forwards}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
.emo{position:fixed;font-size:34px;z-index:20;pointer-events:none;animation:floatup 1.7s ease-out forwards;text-shadow:0 2px 6px #000}
.speaking .pill,.plist li.speaking{outline:2px solid #5fae7acc;outline-offset:1px}

/* ---- Chat & biểu cảm (nằm ngoài #app nên không bị vẽ lại) ---- */
#chat{position:fixed;right:0;bottom:0;width:min(420px,100%);height:min(62vh,480px);background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;z-index:25;display:none;flex-direction:column;box-shadow:0 -10px 30px #000a;padding-bottom:env(safe-area-inset-bottom)}
#chat.open{display:flex}
#chat .head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
#chatlist{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
#chatlist .cm b{color:var(--gold)}
#chatlist .cm.me b{color:var(--ok)}
#chat form{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
#chat form input{flex:1}
#emotray{position:fixed;z-index:26;display:none;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px #000a}
#emotray.open{display:grid}
#emotray button{font-size:1.7rem;padding:.1em .3em;min-height:48px}
@media(max-width:520px){
  .seat{width:98px}
  .disc{width:36px;height:36px;margin-left:-14px}
  .mat{min-height:38px;padding-left:12px}
  .mat .empty{width:36px;height:36px}
  .center .big{font-size:1.9rem}
  .pill{font-size:.76rem}
}
@media(min-width:720px){.table{aspect-ratio:1/.92;max-width:700px}.seat{width:132px}.disc{width:52px;height:52px}}
@media(prefers-reduced-motion:reduce){.disc.drop,.disc.flipin,.seat.turn .pill,#app.shake,button.dbtn.act .disc{animation:none}}
</style>
</head>
<body data-theme="red">
<!-- Bộ hình đĩa vẽ bằng SVG, màu theo chủ đề -->

    <circle cx="50" cy="50" r="24" style="fill:var(--r1)"/>
    <g fill="none" style="stroke:var(--r2)" stroke-width="2.6" stroke-linecap="round">
      <path d="M50 50 m-3 0 a3 3 0 1 1 6 0 a6 6 0 1 1 -12 0 a9 9 0 1 1 18 0 a12 12 0 1 1 -24 0"/>
      <path d="M34 36 q6 -10 16 -10" opacity=".7"/><path d="M66 64 q-6 10 -16 10" opacity=".7"/>
    </g>
  </symbol>
  <symbol id="d-skull" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" style="fill:var(--face2)"/>
    <circle cx="50" cy="50" r="48" style="fill:url(#gF)"/>
    <circle cx="50" cy="50" r="46" fill="none" style="stroke:var(--rim)" stroke-width="2.5"/>
    <path d="M50 20 C34 20 26 32 26 44 C26 52 30 57 34 60 L34 70 C34 73 36 75 39 75 L61 75 C64 75 66 73 66 70 L66 60 C70 57 74 52 74 44 C74 32 66 20 50 20 Z" style="fill:var(--sk)"/>
    <g style="fill:var(--face2)"><ellipse cx="40" cy="46" rx="7.5" ry="8.5"/><ellipse cx="60" cy="46" rx="7.5" ry="8.5"/><path d="M50 53 L45 63 L55 63 Z"/></g>

<div class="wrap" id="app"></div>

<div id="chat">
  <div class="head"><b>💬 Chat</b><button class="sm" id="chatclose">Đóng</button></div>
  <div id="chatlist"></div>
  <form id="chatform"><input id="chatinput" maxlength="140" placeholder="Nhắn gì đó…" autocomplete="off"><button class="primary">Gửi</button></form>

<script>
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMOTES = ['😏', '🤨', '😱', '😂', '😈', '🤞', '🙏', '👀'];
const THEMES = [['red', 'Đêm đỏ'], ['green', 'Rừng xanh'], ['neon', 'Neon']];
let S = null, ws = null, myBid = 1, connected = false, toastT = null, deadlineAt = null, sbOpen = false, deferredInstall = null;
let ANIM = { drop: {}, flip: {}, pop: false };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} }
};
let token = store.get('skull.token'), roomCode = store.get('skull.room');
let theme = store.get('skull.theme') || 'red'; if (!THEMES.some(t => t[0] === theme)) theme = 'red';
document.body.dataset.theme = theme;

// ---------- Âm thanh hiệu ứng (tổng hợp bằng WebAudio, không cần file) ----------
let AC = null, muted = store.get('skull.muted') === '1';
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t0, dur, type = 'sine', vol = .15, f2){
  const a = ac(); if (!a || muted) return; const t = a.currentTime + t0;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(t0, dur, vol = .1, freq = 800){
  const a = ac(); if (!a || muted) return; const t = a.currentTime + t0;
  const buf = a.createBuffer(1, Math.max(1, a.sampleRate * dur | 0), a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol; src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(t);
}
const SFX = {
  place(){ noise(0, .09, .22, 700); tone(150, 0, .13, 'sine', .28, 70); },
  flip(){ noise(0, .05, .1, 3500); tone(660, .03, .25, 'triangle', .12); tone(990, .09, .3, 'triangle', .08); },
  skull(){ tone(240, 0, .7, 'sawtooth', .17, 55); tone(120, .05, .8, 'square', .09, 40); },
  bid(){ tone(520, 0, .08, 'square', .06); tone(780, .07, .12, 'square', .06); },
  pass(){ tone(300, 0, .14, 'sine', .1, 190); },
  turn(){ tone(880, 0, .12, 'sine', .11); tone(1175, .12, .2, 'sine', .09); },
  tick(){ tone(1400, 0, .04, 'square', .05); },
  pop(){ tone(500, 0, .09, 'sine', .12, 900); },
  msg(){ tone(660, 0, .07, 'sine', .08); tone(990, .06, .09, 'sine', .06); },
  success(){ tone(523, 0, .15, 'triangle', .14); tone(784, .12, .35, 'triangle', .14); },
  win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .11, .4, 'triangle', .15)); },
  lose(){ [392, 330, 262].forEach((f, i) => tone(f, i * .22, .4, 'sawtooth', .09)); },
};
const sfx = n => { try { SFX[n](); } catch {} };

// ---------- Nhạc nền: drone + tiếng quán + vài nốt ngẫu nhiên ----------
const Music = {
  on: false, stops: [], timers: [], master: null,
  start(){
    const a = ac(); if (!a || this.on) return; this.on = true;
    const m = this.master = a.createGain(); m.gain.setValueAtTime(0, a.currentTime); m.gain.linearRampToValueAtTime(.55, a.currentTime + 2.5); m.connect(a.destination);
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(m);
    const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = .07; lg.gain.value = 170; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const oscs = [[110, 'sawtooth', .03], [164.8, 'triangle', .05], [111.3, 'sawtooth', .025]].map(([f, t, v]) => {
      const o = a.createOscillator(), g = a.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(lp); o.start(); return o;
    });
    // tiếng ồn quán: nhiễu nâu lọc băng thông
    const len = a.sampleRate * 3, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const ns = a.createBufferSource(); ns.buffer = buf; ns.loop = true;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = .5;
    const ng = a.createGain(); ng.gain.value = .07;
    const l2 = a.createOscillator(), l2g = a.createGain(); l2.frequency.value = .17; l2g.gain.value = .03; l2.connect(l2g); l2g.connect(ng.gain); l2.start();
    ns.connect(bp); bp.connect(ng); ng.connect(m); ns.start();
    this.stops = [() => oscs.forEach(o => o.stop()), () => lfo.stop(), () => l2.stop(), () => ns.stop()];
    const note = (f, vol, dur) => {
      if (!this.on) return; const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(m); o.start(t); o.stop(t + dur + .05);
    };
    const scale = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];
    const arp = () => { if (!this.on) return; note(scale[Math.random() * scale.length | 0], .06, 2.4); if (Math.random() < .4) setTimeout(() => note(scale[Math.random() * scale.length | 0], .04, 2), 450); this.timers.push(setTimeout(arp, 1800 + Math.random() * 2800)); };
    const clink = () => { if (!this.on) return; const f = 2400 + Math.random() * 800; note(f, .02, .35); setTimeout(() => note(f * 1.5, .015, .3), 70); this.timers.push(setTimeout(clink, 7000 + Math.random() * 9000)); };
    arp(); this.timers.push(setTimeout(clink, 4000));
  },
  stop(){
    if (!this.on) return; this.on = false; const a = AC; this.timers.forEach(clearTimeout); this.timers = [];
    if (a && this.master) { this.master.gain.cancelScheduledValues(a.currentTime); this.master.gain.setValueAtTime(this.master.gain.value, a.currentTime); this.master.gain.linearRampToValueAtTime(0, a.currentTime + .6); }
    const st = this.stops, mm = this.master; this.stops = [];
    setTimeout(() => { st.forEach(f => { try { f(); } catch {} }); try { mm.disconnect(); } catch {} }, 700);
  }
};

// So sánh trạng thái cũ/mới để biết cần chạy animation + âm thanh nào
function detect(prev, s){
  ANIM = { drop: {}, flip: {}, pop: false };
  if (!prev || prev.code !== s.code || prev.phase === 'lobby' || s.phase === 'lobby') return;
  let placed = false, flipped = false;
  s.players.forEach(p => {
    const q = prev.players.find(x => x.id === p.id); if (!q) return;
    if (s.round === prev.round && p.mat.length > q.mat.length) { ANIM.drop[p.id] = q.mat.length; placed = true; }
    p.mat.forEach((d, i) => { if (d.up && !(q.mat[i] && q.mat[i].up)) { (ANIM.flip[p.id] = ANIM.flip[p.id] || new Set()).add(i); flipped = true; } });
  });
  const ended = s.phase !== prev.phase && ['roundend', 'choose', 'gameover'].includes(s.phase);
  const failed = s.result && s.result.type === 'fail';
  if (s.bid > 0 && s.bid !== prev.bid) ANIM.pop = true;
  if (ended) {
    if (s.phase === 'gameover') {
      if (s.winner === s.you) { sfx('win'); confetti(); fx('gold'); } else { sfx('lose'); fx('red'); }
    } else if (failed) { sfx('skull'); fx('red'); shake(); }
    else { sfx('success'); fx('gold'); }
  } else if (failed && s.phase === 'choose' && prev.phase !== 'choose') { sfx('skull'); fx('red'); shake(); }
  else if (flipped) sfx('flip');
  else if (placed) sfx('place');
  else if (s.bid > 0 && s.bid !== prev.bid) sfx('bid');
  else if (s.players.filter(p => p.passed).length > prev.players.filter(p => p.passed).length) sfx('pass');
  if (!ended && s.turn === s.you && prev.turn !== s.you && ['place', 'bid'].includes(s.phase)) setTimeout(() => sfx('turn'), 250);
}

function toast(msg){
  clearTimeout(toastT); document.querySelectorAll('.toast').forEach(e => e.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d);
  toastT = setTimeout(() => d.remove(), 3200);
}
function resetLocal(){ token = roomCode = null; S = null; store.set('skull.token', null); store.set('skull.room', null); chatReset(); closeChat(); }
function connect(){
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { connected = true; if (token && roomCode) send({ t: 'rejoin', code: roomCode, token }); render(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') { token = m.token; roomCode = m.code; store.set('skull.token', token); store.set('skull.room', roomCode); if (voiceOn) send({ t: 'voice', on: true }); }
    else if (m.t === 'state') {
      const prev = S; S = m.s; deadlineAt = S.timeLeft != null ? Date.now() + S.timeLeft : null;
      detect(prev, S); syncChat(); syncPeers(); render();
    }
    else if (m.t === 'rtc') { onRtc(m.from, m.data); }
    else if (m.t === 'emote') { floatEmote(m.from, m.e); }
    else if (m.t === 'err') { toast(m.msg); if (m.fatal) { if (voiceOn) voiceStop(); resetLocal(); render(); } }
  };
  ws.onclose = () => { connected = false; setTimeout(connect, 1500); };
}
function leave(){ if (voiceOn) voiceStop(); send({ t: 'leave' }); resetLocal(); history.replaceState(null, '', location.pathname); render(); }

function seatPos(i, n){
  const ang = Math.PI / 2 + i * 2 * Math.PI / n;
  return { x: 50 + 39 * Math.cos(ang), y: 50 + 41 * Math.sin(ang) };
}
function renderGame(){
  const me = S.players.find(p => p.id === S.you);
  const byId = id => S.players.find(p => p.id === id);
  const myTurn = S.turn === S.you;
  const allPlaced = S.players.every(p => p.out || p.mat.length >= 1);
  const phase = S.phase, isHost = S.hostId === S.you;
  const cur = byId(S.turn), ch = byId(S.challenger), bidder = byId(S.bidder);
  const myUnrev = ch && ch.id === S.you ? me.mat.filter(d => !d.up).length : 0;
  const cdTxt = S.timeLeft != null ? ` <span class="cd">⏱ <b data-cd>${Math.ceil(S.timeLeft / 1000)}</b>s</span>` : '';

  let banner = '', bcls = '';
  if (phase === 'place') {
    bcls = myTurn ? 'me' : '';
    banner = !allPlaced
      ? (myTurn ? '<b>Tới lượt bạn:</b> chạm một đĩa trên tay để đặt úp (mỗi người phải đặt ít nhất 1).' : `Đang chờ <b>${esc(cur.name)}</b> đặt đĩa đầu tiên…`)
      : (myTurn ? '<b>Tới lượt bạn:</b> đặt thêm đĩa, hoặc bắt đầu cược.' : `Tới lượt <b>${esc(cur.name)}</b>: đặt thêm hoặc cược.`);
    banner += cdTxt;
  } else if (phase === 'bid') {
    bcls = myTurn ? 'me' : '';
    banner = `Cược hiện tại: <b>${S.bid}</b> hoa hồng (${esc(bidder.name)}). ` + (myTurn ? '<b>Tới lượt bạn:</b> cược cao hơn hoặc bỏ qua.' : `Đợi <b>${esc(cur.name)}</b>…`) + cdTxt;
  } else if (phase === 'flip') {
    bcls = ch.id === S.you ? 'me' : '';
    banner = `<b>${esc(ch.name)}</b> phải lật <b>${S.bid}</b> hoa hồng — đã lật <b>${S.flowers}</b>.` + (ch.id === S.you ? (myUnrev > 0 ? ' Hãy lật đĩa của mình trước.' : ' Chọn đĩa của người khác để lật.') : '') + cdTxt;
  } else if (phase === 'choose') {
    bcls = ch.id === S.you ? 'me' : '';
    banner = (ch.id === S.you ? '💀 Bạn lật trúng đầu lâu của chính mình! <b>Chọn đĩa muốn bỏ.</b>' : `💀 ${esc(ch.name)} trúng đầu lâu của chính mình, đang chọn đĩa bỏ…`) + cdTxt;
  } else if (phase === 'roundend') {
    const r = S.result;
    banner = r.type === 'success' ? `✅ <b>${esc(byId(r.challenger).name)}</b> lật đủ ${r.bid} hoa hồng và được 1 điểm!`
      : `💀 <b>${esc(byId(r.challenger).name)}</b> trượt cược ${r.bid} và mất 1 đĩa${byId(r.challenger).out ? ' (bị loại!)' : ''}.`;
    banner += ` Ván sau <b>${esc(byId(S.nextStarter).name)}</b> đi trước.`;
  } else if (phase === 'gameover') {
    banner = `🏆 <b>${esc(byId(S.winner).name)}</b> chiến thắng!`;
  }

  // ghế quanh bàn: tôi ở dưới cùng, đi theo chiều kim đồng hồ theo thứ tự lượt
  const n = S.players.length, mi = S.players.indexOf(me);
  const flipping = phase === 'flip' && ch.id === S.you;
  const seats = S.players.map((p, k) => {
    const i = (k - mi + n) % n, pos = seatPos(i, n), mine = p.id === S.you, top = pos.y < 50;
    const canFlip = flipping && !p.out && (myUnrev > 0 ? mine : (!mine && p.mat.some(d => !d.up)));
    const tags = [
      p.id === S.bidder && S.bid > 0 && (phase === 'bid' || phase === 'flip') ? `<span class="tag bid${ANIM.pop ? ' pop' : ''}">cược ${S.bid}</span>` : '',
      p.passed && phase === 'bid' ? '<span class="tag">bỏ qua</span>' : '',
      p.out ? '<span class="tag off">bị loại</span>' : '',
      p.bot ? '<span class="tag">BOT</span>' : '',
      !p.bot && !p.connected ? '<span class="tag off">mất kết nối</span>' : '',
      !p.bot && p.connected && p.afk ? '<span class="tag off">AFK</span>' : '',
      p.voice ? '<span class="tag">🎙️</span>' : '',
    ].join('');
    const canKick = isHost && !p.bot && p.id !== S.you && (p.afk || !p.connected);
    return `<div data-pid="${p.id}" class="seat ${top ? 'top' : ''} ${mine ? 'me' : ''} ${S.turn === p.id && ['place', 'bid'].includes(phase) ? 'turn' : ''} ${p.out ? 'out' : ''}" style="left:${pos.x}%;top:${pos.y}%">
      <div class="mat">${p.mat.map((d, j) => discHTML(d, mine, animCls(p.id, j))).join('') || '<span class="empty"></span>'}</div>
      <div class="pill"><span class="nm">${esc(p.name)}${mine ? ' (bạn)' : ''}</span>
        <span class="sub"><span class="pips">${[0, 1].map(j => `<i class="${p.wins > j ? 'on' : ''}"></i>`).join('')}</span><span>tay: ${p.handCount}</span></span>
        ${tags ? `<span class="sub">${tags}</span>` : ''}</div>
      ${canFlip ? `<button class="flipbtn primary" data-flip="${p.id}">Lật</button>` : ''}
      ${canKick ? `<button class="kickbtn" data-kick="${p.id}">Thay bằng bot</button>` : ''}
    </div>`;
  }).join('');

  const center = `<div class="center">${S.bid > 0 && ['bid', 'flip'].includes(phase)
    ? `<div class="big">${S.bid}</div><div class="small">hoa hồng cần lật${phase === 'flip' ? ` · đã lật ${S.flowers}` : ''}</div>`
    : `<div class="big">${S.total || ''}</div><div class="small">${S.total ? 'đĩa trên bàn' : 'Ván ' + S.round}</div>`}
    ${S.timeLeft != null && phase !== 'roundend' ? `<div class="ring">⏱ <span data-cd>${Math.ceil(S.timeLeft / 1000)}</span></div>` : ''}</div>`;

  // panel của tôi
  const handCount = t => S.hand.filter(x => x === t).length;
  const maxBid = S.total, minBid = S.bid + 1;
  const canPlace = phase === 'place' && myTurn && !me.out;
  const handHTML = S.hand.map((t, k) => canPlace
    ? `<button class="dbtn act" data-place="${t}" title="Đặt đĩa này">${handDisc(t)}</button>` : `<button class="dbtn" disabled>${handDisc(t)}</button>`).join('') || '<span style="color:var(--dim)">trống</span>';
  let acts = '';
  if (me.out && phase !== 'gameover') acts = '<div style="color:var(--dim)">Bạn đã bị loại. Cứ ngồi xem nhé!</div>';
  else if (phase === 'place' && myTurn) acts = allPlaced ? bidControls(minBid, maxBid, false) : '';
  else if (phase === 'bid' && myTurn) acts = bidControls(minBid, maxBid, true);
  else if (phase === 'choose' && ch.id === S.you) acts = `<div class="acts">${['F', 'S'].filter(handCount).map(t => `<button data-choose="${t}">Bỏ ${ico(t)}${t === 'S' ? 'đầu lâu' : 'hoa hồng'}</button>`).join('')}</div>`;
  else if (phase === 'roundend') acts = `<div class="acts"><button class="primary" data-next>Ván tiếp theo${S.timeLeft != null ? ` (<span data-cd>${Math.ceil(S.timeLeft / 1000)}</span>)` : ''}</button></div>`;
  else if (phase === 'gameover') acts = isHost ? `<div class="acts"><button class="primary" data-restart>Chơi lại (về phòng chờ)</button></div>` : '<div style="color:var(--dim)">Đợi chủ phòng bắt đầu ván mới.</div>';

  $app.innerHTML = `
  <div class="hdr"><h2>💀 Skull <span class="code" style="font-size:.85rem">${esc(S.code)}</span></h2><span style="color:var(--dim);font-size:.9rem">Ván ${S.round}${connected ? '' : ' · mất kết nối…'}</span></div>
  <div class="tools">${topBtns()}</div>
  <div class="banner ${bcls}">${banner}</div>
  <div class="table"><div class="felt"></div>${center}${seats}</div>
  <div class="panel">
    <div class="lbl">Đĩa trên tay bạn</div>
    <div class="hand">${handHTML}</div>
    ${acts}
  </div>
  ${scoreCard()}
  <div class="card" style="margin-top:12px"><div class="lbl">Nhật ký</div><div class="log" id="log">${S.log.map(l => `<div>${esc(l)}</div>`).join('')}</div></div>
  <div style="margin-top:12px"><button id="leave">Thoát ván</button></div>`;

  ANIM = { drop: {}, flip: {}, pop: false };
  bindTop(); bindScore();
  const lg = document.getElementById('log'); lg.scrollTop = lg.scrollHeight;
  document.getElementById('leave').onclick = () => { if (confirm('Thoát khỏi ván này? (Bạn sẽ không vào lại được)')) leave(); };
  $app.querySelectorAll('[data-flip]').forEach(b => b.onclick = () => send({ t: 'flip', target: b.dataset.flip }));
  $app.querySelectorAll('[data-place]').forEach(b => b.onclick = () => send({ t: 'place', type: b.dataset.place }));
  $app.querySelectorAll('[data-choose]').forEach(b => b.onclick = () => send({ t: 'choose', type: b.dataset.choose }));
  $app.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => { if (confirm('Thay người chơi này bằng bot?')) send({ t: 'kick', id: b.dataset.kick }); });
  $app.querySelectorAll('[data-next]').forEach(b => b.onclick = () => send({ t: 'next' }));
  $app.querySelectorAll('[data-restart]').forEach(b => b.onclick = () => send({ t: 'restart' }));
  const bm = document.getElementById('bminus'), bp = document.getElementById('bplus');
  if (bm) {
    const upd = () => { myBid = Math.min(maxBid, Math.max(minBid, myBid)); document.getElementById('bval').textContent = myBid; };
    bm.onclick = () => { myBid--; upd(); }; bp.onclick = () => { myBid++; upd(); }; upd();
    document.getElementById('dobid').onclick = () => send({ t: 'bid', n: myBid });
    const ps = document.getElementById('dopass'); if (ps) ps.onclick = () => send({ t: 'pass' });
  }
}

function bidControls(minBid, maxBid, canPass){
  if (minBid > maxBid) return canPass ? `<div class="acts" style="margin-top:6px"><button id="dopass">Bỏ qua</button></div>` : '';
  myBid = Math.min(maxBid, Math.max(minBid, myBid));
  return `<div class="acts" style="margin-top:6px">
    <span class="lbl" style="margin:0">Cược</span>
    <span class="stepper"><button id="bminus">−</button><span id="bval">${myBid}</span><button id="bplus">+</button></span>
    <span style="color:var(--dim);font-size:.9rem">/ ${maxBid}</span>
    <button class="primary" id="dobid">Cược</button>
    ${canPass ? '<button id="dopass">Bỏ qua</button>' : ''}
  </div>`;
}

// Đếm ngược chạy riêng, không vẽ lại cả màn hình
let lastTickSec = -1;
setInterval(() => {
  if (!S || deadlineAt == null) return;
  const secs = Math.max(0, Math.ceil((deadlineAt - Date.now()) / 1000));
  document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = secs; });
  if (S.turn === S.you && secs <= 5 && secs > 0 && secs !== lastTickSec && S.phase !== 'roundend') sfx('tick');
  lastTickSec = secs;
}, 250);

// ---------- Chat & biểu cảm ----------
let lastChatN = 0, chatReady = false, unread = 0;
const chatEl = () => document.getElementById('chat');
function chatReset(){ lastChatN = 0; chatReady = false; unread = 0; document.getElementById('chatlist').innerHTML = ''; }
function closeChat(){ chatEl().classList.remove('open'); document.getElementById('emotray').classList.remove('open'); }
function syncChat(){
  const list = document.getElementById('chatlist');
  const open = chatEl().classList.contains('open');
  S.chat.forEach(m => {
    if (m.n <= lastChatN) return; lastChatN = m.n;
    const d = document.createElement('div'); d.className = 'cm' + (m.id === S.you ? ' me' : '');
    d.innerHTML = `<b>${esc(m.name)}:</b> ${esc(m.text)}`; list.appendChild(d);
    if (chatReady && m.id !== S.you) { if (!open) unread++; sfx('msg'); }
  });
  chatReady = true; list.scrollTop = list.scrollHeight;
  const b = document.getElementById('chatbadge'); if (b) { b.textContent = unread; b.style.display = unread ? '' : 'none'; }
}
function openChat(){ chatEl().classList.add('open'); unread = 0; const b = document.getElementById('chatbadge'); if (b) b.style.display = 'none'; const l = document.getElementById('chatlist'); l.scrollTop = l.scrollHeight; }
document.getElementById('chatclose').onclick = closeChat;
document.getElementById('chatform').onsubmit = e => {
  e.preventDefault(); const i = document.getElementById('chatinput'), v = i.value.trim();
  if (v) { send({ t: 'chat', text: v }); i.value = ''; }
};
const tray = document.getElementById('emotray');
tray.innerHTML = EMOTES.map(e => `<button data-e="${e}">${e}</button>`).join('');
tray.onclick = ev => { const b = ev.target.closest('[data-e]'); if (b) { send({ t: 'emote', e: b.dataset.e }); tray.classList.remove('open'); } };

// ---------- Voice chat (WebRTC, mỗi người nối trực tiếp với từng người) ----------
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
let voiceOn = false, micMuted = false, localStream = null;
const peers = {}, levels = {};
const audioBox = document.createElement('div'); audioBox.style.display = 'none'; document.body.appendChild(audioBox);

async function voiceStart(){
  if (voiceOn || !S) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return toast('Trình duyệt không hỗ trợ mic (cần mở bằng link https).');
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); }
  catch { return toast('Không mở được mic. Hãy cho phép quyền micro cho trang này trong trình duyệt.'); }
  voiceOn = true; micMuted = false; ac();
  send({ t: 'voice', on: true });
  watchLevel('local', localStream, S.you);
  syncPeers(); render();
}
function voiceStop(){
  voiceOn = false; send({ t: 'voice', on: false });
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  localStream = null;
  Object.keys(peers).forEach(closePeer); stopLevel('local'); render();
}
function toggleMute(){
  micMuted = !micMuted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
  render();
}
function closePeer(id){
  const p = peers[id]; if (!p) return; delete peers[id];
  try { p.pc.close(); } catch {}
  if (p.audio) { p.audio.srcObject = null; p.audio.remove(); }
  stopLevel(id);
}
// Quy tắc: bên có id nhỏ hơn là người gọi (offer), tránh hai bên gọi nhau cùng lúc
function syncPeers(){
  if (!S) return;
  const want = new Set(voiceOn ? S.players.filter(p => p.id !== S.you && p.voice && p.connected).map(p => p.id) : []);
  Object.keys(peers).forEach(id => { if (!want.has(id)) closePeer(id); });
  want.forEach(id => { if (!peers[id] && S.you < id) makeOffer(id); });
}
function newPeer(id){
  const pc = new RTCPeerConnection(ICE), peer = { pc, pending: [] }; peers[id] = peer;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = e => { if (e.candidate) send({ t: 'rtc', to: id, data: { ice: e.candidate } }); };
  pc.ontrack = e => {
    let a = peer.audio;
    if (!a) { a = document.createElement('audio'); a.autoplay = true; a.playsInline = true; audioBox.appendChild(a); peer.audio = a; }
    a.srcObject = e.streams[0]; a.play().catch(() => {});
    watchLevel(id, e.streams[0], id);
  };
  pc.onconnectionstatechange = () => {
    if (['failed', 'closed'].includes(pc.connectionState) && peers[id] === peer) { closePeer(id); setTimeout(syncPeers, 1500); }
  };
  return peer;
}
async function makeOffer(id){
  if (!localStream || peers[id]) return;
  const peer = newPeer(id);
  try { const o = await peer.pc.createOffer(); await peer.pc.setLocalDescription(o); send({ t: 'rtc', to: id, data: { sdp: peer.pc.localDescription } }); }
  catch { closePeer(id); }
}
async function flushIce(peer){ for (const c of peer.pending.splice(0)) await peer.pc.addIceCandidate(c).catch(() => {}); }
async function onRtc(from, data){
  if (!voiceOn || !localStream || !data) return;
  try {
    if (data.sdp) {
      if (data.sdp.type === 'offer') {
        if (peers[from]) closePeer(from);
        const peer = newPeer(from);
        await peer.pc.setRemoteDescription(data.sdp); await flushIce(peer);
        const a = await peer.pc.createAnswer(); await peer.pc.setLocalDescription(a);
        send({ t: 'rtc', to: from, data: { sdp: peer.pc.localDescription } });
      } else {
        const peer = peers[from];
        if (peer && peer.pc.signalingState === 'have-local-offer') { await peer.pc.setRemoteDescription(data.sdp); await flushIce(peer); }
      }
    } else if (data.ice) {
      const peer = peers[from]; if (!peer) return;
      if (peer.pc.remoteDescription) await peer.pc.addIceCandidate(data.ice).catch(() => {}); else peer.pending.push(data.ice);
    }
  } catch (e) { console.warn('rtc', e); }
}
function watchLevel(key, stream, pid){
  stopLevel(key); const a = ac(); if (!a) return;
  try {
    const src = a.createMediaStreamSource(stream), an = a.createAnalyser(); an.fftSize = 256; src.connect(an);
    levels[key] = { an, src, pid, buf: new Uint8Array(an.frequencyBinCount) };
  } catch {}
}
function stopLevel(key){ const l = levels[key]; if (l) { try { l.src.disconnect(); } catch {} delete levels[key]; } }
setInterval(() => {
  const talking = new Set();
  for (const k in levels) {
    const l = levels[k]; if (k === 'local' && micMuted) continue;
    l.an.getByteFrequencyData(l.buf); let sum = 0; for (const v of l.buf) sum += v;
    if (sum / l.buf.length > 14) talking.add(l.pid);
  }
  document.querySelectorAll('[data-pid]').forEach(el => el.classList.toggle('speaking', talking.has(el.dataset.pid)));
}, 150);

// ---------- Thanh công cụ ----------
function topBtns(){
  return `<button class="sm" id="snd" title="Âm thanh hiệu ứng">${muted ? '🔇' : '🔊'}</button>
    <button class="sm ${musicOn ? 'on' : ''}" id="mus" title="Nhạc nền">🎵</button>
    <button class="sm" id="thm" title="Đổi chủ đề màu">🎨</button>
    ${voiceOn
      ? `<button class="sm ${micMuted ? 'off' : 'on'}" id="vmute">${micMuted ? '🎙️ Mic tắt' : '🎙️ Đang bật'}</button><button class="sm" id="vleave">Rời voice</button>`
      : `<button class="sm" id="vjoin">🎙️ Vào voice</button>`}
    <button class="sm" id="chatbtn">💬<span class="badge" id="chatbadge" style="${unread ? '' : 'display:none'}">${unread}</span></button>
    <button class="sm" id="emobtn">😏</button>`;
}
function bindTop(){
  const $ = id => document.getElementById(id);
  $('snd').onclick = () => { muted = !muted; store.set('skull.muted', muted ? '1' : '0'); if (!muted) sfx('turn'); render(); };
  $('mus').onclick = () => { musicOn = !musicOn; store.set('skull.music', musicOn ? '1' : '0'); if (musicOn) Music.start(); else Music.stop(); render(); };
  $('thm').onclick = () => {
    const i = THEMES.findIndex(t => t[0] === theme); const nx = THEMES[(i + 1) % THEMES.length];
    theme = nx[0]; document.body.dataset.theme = theme; store.set('skull.theme', theme); toast('Chủ đề: ' + nx[1]);
  };
  if ($('vjoin')) $('vjoin').onclick = voiceStart;
  if ($('vleave')) $('vleave').onclick = voiceStop;
  if ($('vmute')) $('vmute').onclick = toggleMute;
  $('chatbtn').onclick = () => chatEl().classList.contains('open') ? closeChat() : openChat();
  $('emobtn').onclick = () => {
    const r = $('emobtn').getBoundingClientRect();
    tray.style.top = (r.bottom + 6) + 'px'; tray.style.left = Math.max(8, Math.min(innerWidth - 260, r.left - 100)) + 'px';
    tray.classList.toggle('open');
  };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
render();
connect();
</script>
